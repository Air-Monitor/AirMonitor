<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AirMonitor</title>
<style>
body{margin:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px 16px;z-index:2}
.title{font-size:20px;font-weight:700}.status{font-size:13px;color:#666;margin-top:4px}
main{padding:10px 12px 30px}
.msg{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #00000012}
.time{font-size:12px;color:#777;margin-bottom:5px}
.text{font-size:16px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<header>
<div class="title">AirMonitor</div>
<div class="status" id="status">Подключение…</div>
</header>
<main id="messages"></main>
<script>
const list=document.getElementById('messages');
const statusEl=document.getElementById('status');
let items=[];

function render(){
 list.innerHTML='';
 items.slice().reverse().forEach(x=>{
  const el=document.createElement('div');
  el.className='msg';
  const t=document.createElement('div');
  t.className='time';
  t.textContent=x.date;
  const text=document.createElement('div');
  text.className='text';
  text.textContent=x.text||'';
  el.append(t,text);
  list.appendChild(el);
 });
}

async function load(){
 try{
  const r=await fetch('/messages',{cache:'no-store'});
  items=await r.json();
  render();
  statusEl.textContent='Подключено • новые сообщения сверху';
 }catch(e){statusEl.textContent='Нет связи с сервером';}
}

function connect(){
 const es=new EventSource('/stream');
 es.onopen=()=>statusEl.textContent='Подключено • новые сообщения сверху';
 es.onmessage=e=>{
  try{
   items.push(JSON.parse(e.data));
   items=items.slice(-20);
   render();
   if(navigator.vibrate) navigator.vibrate(120);
  }catch(_){}
 };
 es.onerror=()=>statusEl.textContent='Переподключение…';
}
load(); connect();
</script>
</body>
</html>
