<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AirMonitor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}
header{background:#fff;border-bottom:1px solid #ddd;padding:14px 16px 10px;position:relative;z-index:5}
.title{font-size:20px;font-weight:700}
.status{font-size:13px;color:#666;margin-top:4px}
.hint{text-align:center;font-size:12px;color:#888;margin-top:8px}
.support{display:inline-flex;align-items:center;gap:5px;margin-top:8px;background:#e9f7ef;color:#167a45;text-decoration:none;border:1px solid #9ed8b8;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700}
.refresh{height:0;overflow:hidden;text-align:center;color:#777;font-size:13px;transition:height .15s}
.refresh.show{height:28px;padding-top:7px}
.viewport{width:100%;height:calc(100vh - 88px);overflow:hidden}
.pages{display:flex;width:300%;height:100%;transform:translateX(-33.3333%);transition:transform .25s ease}
.page{width:33.3333%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:30px}
.page-inner{padding:10px 12px 30px}
.section-title{font-size:18px;font-weight:700;margin:8px 0 12px}
.alert{background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 3px #00000012;display:flex;align-items:center;justify-content:space-between;gap:10px}
.alert.active{border-left:5px solid #d00}
.alert.clear{border-left:5px solid #159447}
.place{font-size:17px;font-weight:600}
.alerttime{font-size:12px;color:#777;margin-top:4px}
.badge{font-size:14px;font-weight:700;white-space:nowrap}
.badge.red{color:#c00}.badge.green{color:#159447}
.msg{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #00000012}
.time{font-size:12px;color:#777;margin-bottom:5px}
.text{font-size:16px;white-space:pre-wrap;word-break:break-word}
.loading{text-align:center;color:#777;font-size:13px;padding:12px}
.voicebox{background:#fff;border-radius:14px;padding:16px;margin:8px 0;box-shadow:0 1px 3px #00000012}
.radioBox{min-height:calc(100vh - 155px);background:#fff;border-radius:18px;padding:24px 18px;margin:8px 0;box-shadow:0 1px 3px #00000012;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.radioMessage{font-size:30px;line-height:1.22;font-weight:700;white-space:pre-wrap;word-break:break-word;width:100%}
.radioTime{font-size:15px;color:#777;margin-top:18px}
#radioSound{margin-top:28px;background:#111;color:#fff;min-width:210px}
.voicebuttons{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600}
#voiceStart{background:#111;color:#fff}
#voiceStop{background:#eee;color:#111}
.voiceStatus{font-size:13px;color:#666;margin-top:10px}
.lastSpeech{font-size:15px;margin-top:14px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <div class="title">AirMonitor</div>
  <div class="status" id="status">Підключення…</div>
  <a class="support" href="https://send.monobank.ua/jar/8wu1Eh8dnF" target="_blank" rel="noopener">❤️ Підтримати AirMonitor</a>
  <div class="hint" id="hint">← Радіо · Тривоги →</div>
</header>

<div id="refresh" class="refresh">Оновлення…</div>

<div class="viewport" id="viewport">
<div class="pages" id="pages">

<section class="page" id="voicePage">
  <div class="page-inner">
    <div class="section-title">Радіо</div>
    <div class="radioBox">
      <div class="radioMessage" id="radioMessage">Очікуємо нове повідомлення…</div>
      <div class="radioTime" id="radioTime"></div>
      <button id="radioSound">🔇 Звук вимкнено</button>
      <div class="voiceStatus" id="voiceStatus">Радіо вимкнено</div>
    </div>
  </div>
</section>

<section class="page" id="messagesPage">
  <div class="page-inner">
    <div class="section-title">Air Defense — повідомлення</div>
    <div id="messages"></div>
    <div id="loading" class="loading" style="display:none">Завантажуємо старі повідомлення…</div>
    <div id="older"></div>
  </div>
</section>

<section class="page" id="alertsPage">
  <div class="page-inner">
    <div class="section-title">Повітряні тривоги — Київська область</div>
    <div id="alerts"><div class="loading">Завантаження…</div></div>
    <div class="loading">Джерело: Київська ОВА</div>
  </div>
</section>

</div>
</div>

<script>
const pages=document.getElementById('pages');
const viewport=document.getElementById('viewport');
const voicePage=document.getElementById('voicePage');
const messagesPage=document.getElementById('messagesPage');
const alertsPage=document.getElementById('alertsPage');
const list=document.getElementById('messages');
const statusEl=document.getElementById('status');
const alertsEl=document.getElementById('alerts');
const loadingEl=document.getElementById('loading');
const refreshEl=document.getElementById('refresh');
const hintEl=document.getElementById('hint');
const radioSound=document.getElementById('radioSound');
const radioMessage=document.getElementById('radioMessage');
const radioTime=document.getElementById('radioTime');
const voiceStatus=document.getElementById('voiceStatus');
const lastSpeech=document.getElementById('lastSpeech');

let items=[];
let loadingOlder=false;
let noMoreHistory=false;
let currentPage=1; // 0 voice, 1 messages, 2 alerts
let speechEnabled=false;

function showPage(page){
  currentPage=page;
  pages.style.transform='translateX(-'+(page*33.3333)+'%)';
  if(page===0)hintEl.textContent='Радіо ← · → Повідомлення';
  if(page===1)hintEl.textContent='← Радіо · Тривоги →';
  if(page===2)hintEl.textContent='← Повідомлення';
}

function formatMessage(text){
  return text || '';
}

function renderRadio(){
  if(!items.length){radioMessage.textContent='Очікуємо нове повідомлення…';radioTime.textContent='';return;}
  const x=items[items.length-1];
  radioMessage.textContent=x.text||'';
  radioTime.textContent=x.date||'';
}

function renderMessages(){
  renderRadio();
  list.innerHTML='';
  items.slice().reverse().forEach(x=>{
    const el=document.createElement('div');
    el.className='msg';
    const t=document.createElement('div');
    t.className='time';
    t.textContent=x.date;
    const text=document.createElement('div');
    text.className='text';
    text.textContent=x.text||'';
    el.append(t,text);
    list.appendChild(el);
  });
}

async function loadInitial(){
  try{
    const r=await fetch('/messages?limit=50',{cache:'no-store'});
    const data=await r.json();
    if(Array.isArray(data)){items=data;renderMessages();}
    statusEl.textContent='Підключено • нові повідомлення зверху';
  }catch(e){statusEl.textContent='Немає зв’язку із сервером';}
}

async function refresh(){
  refreshEl.classList.add('show');
  try{
    await loadInitial();
    await loadAlerts();
    statusEl.textContent='Оновлено • дані актуальні';
    setTimeout(()=>statusEl.textContent='Підключено • нові повідомлення зверху',1500);
  }finally{setTimeout(()=>refreshEl.classList.remove('show'),300);}
}

async function loadOlder(){
  if(loadingOlder||noMoreHistory||!items.length)return;
  loadingOlder=true;loadingEl.style.display='block';
  const oldHeight=messagesPage.scrollHeight,oldTop=messagesPage.scrollTop,oldest=items[0].id;
  try{
    const r=await fetch('/history?offset_id='+encodeURIComponent(oldest)+'&limit=50',{cache:'no-store'});
    const older=await r.json();
    if(!Array.isArray(older)||!older.length)noMoreHistory=true;
    else{
      const existing=new Set(items.map(x=>x.id));
      items=older.filter(x=>!existing.has(x.id)).concat(items);
      renderMessages();
      messagesPage.scrollTop=oldTop+(messagesPage.scrollHeight-oldHeight);
    }
  }catch(e){}finally{loadingOlder=false;loadingEl.style.display='none';}
}

function alertDateValue(s){
  const m=String(s||'').match(/^(\d{2})\.(\d{2})\.(\d{4})[ ,]+(\d{2}):(\d{2}):(\d{2})$/);
  if(!m)return 0;
  return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]),Number(m[5]),Number(m[6])).getTime();
}

function renderAlerts(data){
  const rows=(data.alerts||[]).slice().sort((a,b)=>{
    return alertDateValue(b.date)-alertDateValue(a.date);
  });
  if(!rows.length){
    alertsEl.innerHTML='<div class="alert clear"><div><div class="place">🟢 Активних повітряних тривог немає</div><div class="alerttime">Джерело: Київська ОВА</div></div><div class="badge green">ВІДБІЙ</div></div>';
    return;
  }
  alertsEl.innerHTML='';
  rows.forEach(a=>{
    const el=document.createElement('div');
    el.className='alert '+(a.active?'active':'clear');
    const left=document.createElement('div');
    const place=document.createElement('div');
    place.className='place';
    place.textContent=(a.active?'🔴 ':'🟢 ')+a.place;
    const tm=document.createElement('div');
    tm.className='alerttime';
    tm.textContent='Змінено: '+a.date;
    left.append(place,tm);
    const badge=document.createElement('div');
    badge.className='badge '+(a.active?'red':'green');
    badge.textContent=a.active?'ТРИВОГА':'ВІДБІЙ';
    el.append(left,badge);
    alertsEl.appendChild(el);
  });
}

async function loadAlerts(){
  try{
    const r=await fetch('/alerts',{cache:'no-store'});
    renderAlerts(await r.json());
  }catch(e){alertsEl.innerHTML='<div class="alert">Не вдалося оновити тривоги</div>';}
}

function speak(text){
  if(!speechEnabled || !('speechSynthesis' in window) || !text)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='uk-UA';
  u.rate=1;
  u.pitch=1;
  lastSpeech.textContent='Останнє озвучене:\n'+text;
  window.speechSynthesis.speak(u);
}

radioSound.addEventListener('click',()=>{
  speechEnabled=!speechEnabled;
  if(speechEnabled){
    radioSound.textContent='🔊 Звук увімкнено';
    voiceStatus.textContent='Радіо увімкнено • українська мова';
    if(items.length)speak(items[items.length-1].text);
  }else{
    window.speechSynthesis.cancel();
    radioSound.textContent='🔇 Звук вимкнено';
    voiceStatus.textContent='Радіо вимкнено';
  }
});

function connect(){
  const es=new EventSource('/stream');
  es.onopen=()=>statusEl.textContent='Підключено • нові повідомлення зверху';
  es.onmessage=e=>{
    try{
      const x=JSON.parse(e.data);
      if(x.type==='alert'){
        loadAlerts();
        if(navigator.vibrate)navigator.vibrate([120,80,120]);
        return;
      }
      if(!items.some(i=>i.id===x.id)){
        items.push(x);items=items.slice(-500);renderMessages();
        if(navigator.vibrate)navigator.vibrate(120);
        speak(x.text);
      }
    }catch(_){}
  };
  es.onerror=()=>statusEl.textContent='Перепідключення…';
}

let startX=0,startY=0,swiping=false;
viewport.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  startX=e.touches[0].clientX;startY=e.touches[0].clientY;swiping=true;
},{passive:true});

viewport.addEventListener('touchend',async e=>{
  if(!swiping)return;swiping=false;
  const dx=e.changedTouches[0].clientX-startX;
  const dy=e.changedTouches[0].clientY-startY;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.2){
    if(dx<0 && currentPage<2)showPage(currentPage+1);
    else if(dx>0 && currentPage>0)showPage(currentPage-1);
    return;
  }
  const page=currentPage===0?voicePage:currentPage===1?messagesPage:alertsPage;
  if(dy>70 && page.scrollTop<=5)await refresh();
});

const observer=new IntersectionObserver(entries=>{
  if(currentPage===1 && entries[0].isIntersecting)loadOlder();
});
observer.observe(document.getElementById('older'));

loadInitial();loadAlerts();connect();setInterval(loadAlerts,30000);
</script>
</body>
</html>
