<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AirMonitor</title>
<style>
body{margin:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}
header{position:sticky;top:0;z-index:5;background:#fff;padding:14px 16px;border-bottom:1px solid #ddd;font-size:20px;font-weight:700}
#status{font-size:13px;font-weight:400;color:#777;margin-top:3px}
#list{padding:8px 12px 24px}
.msg{background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;box-shadow:0 1px 3px #0001}
.time{font-size:12px;color:#888;margin-bottom:4px}
.text{font-size:17px;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:#888;text-align:center;margin-top:40px}
</style>
</head>
<body>
<header>
AirMonitor
<div id="status">Подключение…</div>
</header>
<div id="list"><div class="empty">Загрузка…</div></div>
<script>
const list=document.getElementById('list');
const statusEl=document.getElementById('status');
let items=[];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 if(!items.length){list.innerHTML='<div class="empty">Сообщений пока нет</div>';return;}
 list.innerHTML=items.map(x=>`<div class="msg"><div class="time">${escapeHtml(x.time||'')}</div><div class="text">${escapeHtml(x.text||'')}</div></div>`).join('');
}
async function load(){
 try{
  const r=await fetch('/messages',{cache:'no-store'});
  const data=await r.json();
  items=data.reverse();
  render();
  statusEl.textContent='Подключено';
 }catch(e){statusEl.textContent='Нет связи';}
}
function stream(){
 const es=new EventSource('/stream');
 es.onopen=()=>{statusEl.textContent='Подключено • новые сообщения сверху';};
 es.onmessage=e=>{
  try{
   const x=JSON.parse(e.data);
   items.unshift(x); items=items.slice(0,20); render();
   if(navigator.vibrate) navigator.vibrate(120);
  }catch(_){}
 };
 es.onerror=()=>{statusEl.textContent='Нет связи • повторное подключение…';};
}
load().then(stream);
</script>
</body>
</html>
